<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classic Optimizer</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header>
    <h1>Classic Optimizer</h1>
    <p>Build optimal DK Classic lineups with environment adjustments.</p>
  </header>

  <main class="container">
    <div id="error-banner" class="error-banner" style="display:none"></div>
    <div id="data-source" class="notice" style="display:none"></div>

    <section class="panel">
      <h2>Controls</h2>
      <div class="controls">
        <div>
          <label for="salary-cap">Salary Cap</label>
          <input id="salary-cap" type="number" value="50000" />
        </div>
        <div>
          <label for="team-cap">Max Players Per Team</label>
          <input id="team-cap" type="number" value="4" />
        </div>
        <div>
          <label for="game-select">Game</label>
          <select id="game-select"></select>
        </div>
        <div>
          <label for="environment">Environment</label>
          <select id="environment">
            <option value="Neutral">Neutral</option>
            <option value="Shootout">Shootout</option>
            <option value="Blowout/Ugly">Blowout/Ugly</option>
          </select>
        </div>
        <div id="favored-wrap" style="display:none">
          <label for="favored-team">Favored Team</label>
          <select id="favored-team"></select>
        </div>
        <div>
          <label for="only-game">Only selected game</label>
          <div>
            <input id="only-game" type="checkbox" checked />
          </div>
        </div>
        <div>
          <label for="locks">Locks (comma-separated)</label>
          <input id="locks" type="text" placeholder="Josh Allen, Stefon Diggs" />
        </div>
        <div>
          <label for="excludes">Excludes (comma-separated)</label>
          <input id="excludes" type="text" placeholder="Defense Team" />
        </div>
      </div>
      <div class="action-row" style="margin-top:16px;">
        <button class="btn-primary" id="optimize-btn">Optimize Classic Lineup</button>
        <a class="btn-secondary" href="index.html">Back Home</a>
      </div>
    </section>

    <section class="panel">
      <h2>Recommended Lineup</h2>
      <div id="recommended-note" class="notice" style="display:none"></div>
      <table class="table" id="recommended-table">
        <thead>
          <tr>
            <th>Pos</th>
            <th>Name</th>
            <th>Team</th>
            <th>Salary</th>
            <th>Proj</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>Optimized Lineup</h2>
      <table class="table" id="optimized-table">
        <thead>
          <tr>
            <th>Pos</th>
            <th>Name</th>
            <th>Team</th>
            <th>Salary</th>
            <th>Proj</th>
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr>
            <td colspan="3">Totals</td>
            <td id="opt-total-salary">0</td>
            <td id="opt-total-proj">0</td>
          </tr>
        </tfoot>
      </table>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="assets/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/glpk.js@0.19.0/dist/glpk.min.js" onerror="window.utils && window.utils.showError('GLPK failed to load. Please refresh or check your connection.');"></script>
  <script src="assets/optimizer_classic.js"></script>
</body>
</html>
