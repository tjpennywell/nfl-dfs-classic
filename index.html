<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NFL DFS Classic Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./style.css?v=CLASSIC-RUSH-PASS-V1" />
</head>
<body>
  <header class="top">
    <h1>NFL DFS Classic Dashboard</h1>
    <div id="versionStamp" class="muted"></div>
  </header>

  <section class="card">
    <h2>Games</h2>
    <table id="gamesTable"></table>
  </section>

  <section class="card">
    <h2>Players</h2>
    <div class="row">
      <input id="playerSearch" placeholder="Search player (name/team)" />
      <select id="posFilter">
        <option value="">All Pos</option>
        <option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>DST</option>
      </select>
      <select id="teamFilter"></select>
      <select id="sortBy">
        <option value="proj_desc">Proj ↓</option>
        <option value="value_desc">Value ↓</option>
        <option value="own_asc">Ownership ↑</option>
        <option value="salary_desc">Salary ↓</option>
      </select>
    </div>
    <table id="playersTable"></table>
  </section>

  <section class="card">
    <h2>Classic Lineup Builder</h2>
    <div class="row">
      <select id="primaryGameSelect"></select>
      <button id="buildLineupBtn">Build Lineup</button>
    </div>
    <div id="lineupSummary"></div>
    <table id="lineupTable"></table>
  </section>

  <section class="card">
    <h2>Heatmaps</h2>

    <div class="row">
      <button id="showPassHm" type="button">Pass</button>
      <button id="showRushHm" type="button">Rush</button>

      <span class="muted">Off:</span>
      <select id="hmOffTeam"></select>

      <span class="muted">Def:</span>
      <select id="hmDefTeam"></select>
    </div>

    <div id="heatmapMeta" class="muted" style="margin:6px 0 10px;"></div>
    <table id="heatmapTable"></table>
  </section>

  <script defer src="./app.js?v=CLASSIC-RUSH-PASS-V1"></script>
</body>
</html>
