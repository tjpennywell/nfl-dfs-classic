<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NFL Showdown Optimizer</title>
    <!-- Use the dark theme CSS from optimizer -->
    <link rel="stylesheet" href="../optimizer/optimizer.css">
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <!-- GLPK.js will be imported in the module -->
    <script type="module" src="showdown.js"></script>
</head>
<body>
    <header>
        <h1>NFL DFS Showdown Optimizer</h1>
    </header>
    <main>
        <!-- Controls for showdown optimization -->
        <section id="controls">
            <label>
                Salary Cap:
                <input type="number" id="salaryCap" value="50000" min="0" step="100">
            </label>
            <label>
                Max Players per Team:
                <input type="number" id="maxTeam" value="4" min="1" step="1">
            </label>
            <label>
                Game:
                <select id="gameSelect"></select>
            </label>
            <label>
                Environment:
                <select id="envSelect">
                    <option value="neutral">Neutral</option>
                    <option value="blowout">Blowout (One-sided)</option>
                    <option value="shootout">Shootout (High-scoring)</option>
                    <option value="defensive">Defensive (Slow/Ugly)</option>
                </select>
            </label>
            <label>
                Favoured Team:
                <select id="favoredTeam"></select>
            </label>
            <button id="optimizeBtn">Optimize Showdown</button>
        </section>
        <!-- Showdown lineup output -->
        <section id="lineup">
            <h2>Showdown Lineup</h2>
            <table id="sdLineup" class="lineup-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Position</th>
                        <th>Team</th>
                        <th>Role</th>
                        <th>Salary</th>
                        <th>Projection</th>
                    </tr>
                </thead>
                <tbody></tbody>
                <tfoot>
                    <tr id="sdTotals"></tr>
                </tfoot>
            </table>
        </section>
        <div id="status"></div>
    </main>
</body>
</html>
